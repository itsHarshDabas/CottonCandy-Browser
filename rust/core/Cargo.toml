[package]
name = "cottoncandy-core"
description = "CottonCandy's browser logic, with no web engine: settings, address bar, history and bookmarks, shields, Grace, extensions"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
adblock = { version = "0.13", default-features = false, features = ["embedded-domain-resolver", "full-regex-handling"] }
percent-encoding = "2"
ring = "0.17"
rusqlite = { version = "0.43", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[dev-dependencies]
tempfile = "3"
