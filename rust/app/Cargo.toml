[package]
name = "cottoncandy"
description = "CottonCandy, the GraceOS web browser, on Chromium (CEF)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
cottoncandy-core = { path = "../core" }
cef = { version = "=156.7.0", default-features = false }
cef-dll-sys = { version = "=156.7.0", default-features = false }
percent-encoding = "2"
ring = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
