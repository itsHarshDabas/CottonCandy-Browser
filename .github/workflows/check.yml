name: check
on: [push, pull_request, workflow_dispatch]
jobs:
  check:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - run: pacman -Syu --noconfirm --needed python python-pytest desktop-file-utils make git
      - uses: actions/checkout@v4
      - run: make check
      # The packaged dependencies exist and the script's Qt imports resolve against them.
      - run: pacman -S --noconfirm --needed pyside6 qt6-webengine qt6-svg
      - run: >-
          python -c "from PySide6 import QtSvg, QtNetwork, QtWebEngineCore, QtWebEngineWidgets;
          from PySide6.QtWebEngineCore import QWebEngineProfile, QWebEngineSettings, QWebEngineUrlScheme, QWebEngineLoadingInfo, QWebEnginePage;
          from PySide6.QtGui import QWindow, QStyleHints;
          assert hasattr(QWebEngineProfile.PersistentPermissionsPolicy, 'AskEveryTime');
          assert hasattr(QWebEngineSettings.UnknownUrlSchemePolicy, 'AllowUnknownUrlSchemesFromUserInteraction');
          assert hasattr(QWebEngineSettings.WebAttribute, 'ErrorPageEnabled');
          assert hasattr(QWebEngineLoadingInfo.ErrorDomain, 'CertificateErrorDomain');
          assert all(hasattr(QWebEnginePage, n) for n in ('loadingChanged', 'recentlyAudibleChanged', 'permissionRequested'));
          assert hasattr(QWindow, 'startSystemMove') and hasattr(QStyleHints, 'setColorScheme');
          from PySide6.QtWebEngineCore import QWebEngineScript; from PySide6.QtCore import QProcess; from PySide6.QtWidgets import QPlainTextEdit;
          assert int(QWebEngineScript.ScriptWorldId.ApplicationWorld.value) == 1;
          assert hasattr(QProcess.ProcessError, 'FailedToStart') and hasattr(QProcess, 'startDetached');
          print('pyside6 + qt6-webengine OK')"
