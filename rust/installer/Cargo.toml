[package]
name = "cottoncandy-installer"
description = "CottonCandy's installer and uninstaller"
version.workspace = true
edition.workspace = true
rust-version = "1.88"
publish.workspace = true
license.workspace = true

[[bin]]
name = "cottoncandy-setup"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts", "x11"] }
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
rfd = { version = "0.18", default-features = false }
winreg = "0.56"
mslnk = "0.1"
windows-sys = { version = "0.61", features = ["Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_Foundation", "Win32_System_Com"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
