# cargo-deny: known vulnerabilities, licenses and where crates come from. Run `cargo deny check` in rust/.
[graph]
all-features = false

[advisories]
# Unmaintained crates are reported; anything with a security advisory fails.
unmaintained = "workspace"
yanked = "deny"

[licenses]
# Licenses allowed for dependencies. bzip2 and CDLA-Permissive-2.0 come only from the build-time
# CEF downloader (download-cef), so they never ship in the browser.
allow = [
    "bzip2-1.0.6",
    "CDLA-Permissive-2.0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
    "CC0-1.0",
    # The fonts built into the installer's UI toolkit (egui): free font licences.
    "OFL-1.1",
    "Ubuntu-font-1.0",
]
confidence-threshold = 0.9
# CottonCandy's own crates aren't published; the repository's license applies to them.
private = { ignore = true }

[bans]
multiple-versions = "allow"
wildcards = "deny"
# The app's path dependency on core has no version number; fine for unpublished crates.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
