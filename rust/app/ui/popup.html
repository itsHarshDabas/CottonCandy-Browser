<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="cc-token" content="{{TOKEN}}">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'">
<title>Popup</title>
<link rel="stylesheet" href="/ui/base.css">
<link rel="stylesheet" href="/theme.css">
<style>
  /* Overlays can't be see-through, so the box fills the whole popup. */
  html, body { background: var(--panel); overflow: hidden; user-select: none; }
  .find { display: flex; align-items: center; gap: 4px; }
  .find input { flex: 1; min-width: 0; }
  .find .count { min-width: 64px; text-align: right; padding-right: 4px; }
  #box { margin: 0; background: var(--panel); border: 1px solid var(--hair); padding: 6px; max-height: 100vh; overflow-y: auto; }
  .item { height: 32px; display: flex; align-items: center; gap: 10px; padding: 0 10px; border-radius: 7px; color: var(--text); white-space: nowrap; }
  .item:hover, .item.sel { background: var(--hover); }
  .item .k { margin-left: auto; color: var(--text-3); font-size: 11.5px; }
  .item svg { width: 15px; height: 15px; flex: none; color: var(--text-2); }
  .item .t { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .item .u { color: var(--text-3); min-width: 0; overflow: hidden; text-overflow: ellipsis; flex: 1; }
  .item.check::after { content: "✓"; margin-left: 8px; color: var(--accent); }
  .sep { height: 1px; background: var(--hair); margin: 5px 4px; }
  .zoom { display: flex; align-items: center; gap: 4px; padding: 0 4px 0 10px; height: 34px; }
  .zoom .lbl { flex: 1; } .zoom .val { width: 48px; text-align: center; font-variant-numeric: tabular-nums; }
  .head { display: flex; align-items: center; gap: 10px; padding: 8px 8px 10px; }
  .head h2 { font-size: 14px; margin: 0; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row { display: flex; align-items: center; gap: 10px; padding: 7px 8px; min-height: 38px; }
  .row .grow { flex: 1; min-width: 0; } .row .sub { color: var(--text-3); font-size: 11.5px; }
  .big { font-size: 28px; font-weight: 650; font-variant-numeric: tabular-nums; }
  .stats { display: flex; gap: 12px; padding: 4px 8px 10px; } .stats > div { flex: 1; background: var(--card); border-radius: var(--radius); padding: 8px 10px; }
  .dl { display: flex; align-items: center; gap: 10px; padding: 8px; border-radius: 8px; }
  .dl:hover { background: var(--hover); }
  .bar { height: 4px; border-radius: 2px; background: var(--selected); overflow: hidden; margin-top: 5px; } .bar > i { display: block; height: 100%; background: var(--accent); }
  .empty { padding: 18px 10px; text-align: center; color: var(--text-2); }
  .foot { display: flex; gap: 8px; padding: 8px 6px 4px; justify-content: flex-end; }
  select.field { height: 30px; padding: 0 8px; }
</style>
</head>
<body>
<div id="box" class="scroll" role="menu"></div>
<script src="/ui/cc.js"></script>
<script src="/ui/popup.js"></script>
</body>
</html>
