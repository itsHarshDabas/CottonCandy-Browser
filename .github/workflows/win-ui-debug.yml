name: win-ui-debug
# Temporary: runs the published Windows build on a Windows machine and records what its window shows.
on:
  push:
    branches: [debug/windows-ui]
  workflow_dispatch:
    inputs:
      tag:
        description: Release to test, or empty to build this branch
        default: v1.0-beta
permissions:
  contents: write
jobs:
  probe:
    runs-on: windows-2025
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: choco install ninja -y
      - uses: actions/cache@v4
        with:
          path: C:\cef
          key: cef-Windows-156.7.0+156.0.31
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: rust }
      - name: Build this branch
        shell: bash
        working-directory: rust
        env:
          CEF_PATH: C:\cef
        run: |
          if [ ! -f "$CEF_PATH/archive.json" ]; then
            cargo install export-cef-dir --version "=156.7.0+156.0.31" --locked
            export-cef-dir --force "$CEF_PATH"
          fi
          cargo build --release -p cottoncandy
          mkdir -p ../app && cp -r "$CEF_PATH"/. ../app/ && cp target/release/cottoncandy.exe ../app/
          echo "EXE=$(cygpath -w "$PWD/../app/cottoncandy.exe")" >> "$GITHUB_ENV"
          mkdir -p ../out
      - name: Machine
        run: |
          Get-CimInstance Win32_VideoController | Format-List Name, DriverVersion, CurrentHorizontalResolution, CurrentVerticalResolution
      - name: Run it and look
        run: |
          cd tools/win-debug; npm i --silent playwright-core@1.49.1; cd ../..
          ./tools/win-debug/control.ps1
          $env:CC_DEBUG = "1"; $env:CC_DEBUG_PORT = "9222"
          $p = Start-Process $env:EXE -PassThru -RedirectStandardOutput out\stdout.txt -RedirectStandardError out\stderr.txt
          Start-Sleep 20
          ./tools/win-debug/shot.ps1 -Path out\1-started.png
          node tools/win-debug/probe.js out
          ./tools/win-debug/shot.ps1 -Path out\2-after-probe.png
          # Real mouse and keyboard: click the middle of the window (the new tab's search box) and type.
          Add-Type -AssemblyName System.Windows.Forms
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          ./tools/win-debug/focus.ps1 startup
          node tools/win-debug/listen.js start
          Add-Type -AssemblyName System.Windows.Forms; foreach ($c in "hello".ToCharArray()) { [System.Windows.Forms.SendKeys]::SendWait("$c"); Start-Sleep -Milliseconds 150 }
          Start-Sleep 2
          ./tools/win-debug/focus.ps1 after-hello
          node tools/win-debug/values.js
          node tools/win-debug/listen.js read
          [System.Windows.Forms.SendKeys]::SendWait("{ESC}"); Start-Sleep 1
          [System.Windows.Forms.SendKeys]::SendWait("^l"); Start-Sleep 2
          ./tools/win-debug/focus.ps1 after-ctrl-l
          node tools/win-debug/values.js
          node tools/win-debug/listen.js start
          foreach ($c in "example".ToCharArray()) { [System.Windows.Forms.SendKeys]::SendWait("$c"); Start-Sleep -Milliseconds 150 }
          Start-Sleep 2
          ./tools/win-debug/focus.ps1 after-example
          node tools/win-debug/values.js
          node tools/win-debug/listen.js read
          ./tools/win-debug/shot.ps1 -Path out\4-typed-in-toolbar.png
          Get-Process cottoncandy -ErrorAction SilentlyContinue | Format-Table Id, Responding, MainWindowTitle, CPU
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          Start-Sleep 2
          Get-ChildItem $env:LOCALAPPDATA, $env:APPDATA -Recurse -Filter cef.log -ErrorAction SilentlyContinue | ForEach-Object { Copy-Item $_.FullName out\; "== $($_.FullName)"; Get-Content $_.FullName -Tail 200 }
          Get-Content out\stdout.txt, out\stderr.txt -ErrorAction SilentlyContinue | Select-Object -Last 200
      - name: Keep the screenshots on a draft release
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view debug-win-ui -R $env:GITHUB_REPOSITORY 2>$null; if ($LASTEXITCODE -ne 0) { gh release create debug-win-ui -R $env:GITHUB_REPOSITORY --draft --title "debug-win-ui (temporary)" --notes "Temporary screenshots." }
          gh release upload debug-win-ui -R $env:GITHUB_REPOSITORY --clobber (Get-ChildItem out\*.png).FullName
