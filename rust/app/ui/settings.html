<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="cc-token" content="{{TOKEN}}">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'">
<title>Settings</title>
<link rel="stylesheet" href="/ui/base.css">
<link rel="stylesheet" href="/ui/page.css">
<link rel="stylesheet" href="/theme.css">
<style>
  body { display: flex; min-height: 100vh; }
  nav { width: 232px; flex: none; position: sticky; top: 0; height: 100vh; padding: 22px 12px; border-right: 1px solid var(--hair); background: var(--bg-2); overflow-y: auto; }
  nav h1 { font-size: 20px; font-weight: 650; margin: 2px 10px 16px; letter-spacing: -.01em; }
  nav .find { width: 100%; margin-bottom: 12px; }
  nav a { display: flex; align-items: center; gap: 10px; height: var(--row); padding: 0 10px; border-radius: var(--radius); color: var(--text-2); }
  nav a svg { width: 17px; height: 17px; flex: none; }
  nav a:hover { background: var(--hover); color: var(--text); }
  nav a.on { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  main { flex: 1; min-width: 0; padding: 26px 34px 80px; max-width: 860px; }
  section { margin-bottom: 34px; scroll-margin-top: 20px; }
  section > h2 { font-size: 17px; font-weight: 650; margin: 0 0 4px; }
  section > p.lead { margin: 0 0 12px; color: var(--text-2); }
  h3 { font-size: 12px; font-weight: 650; text-transform: uppercase; letter-spacing: .05em; color: var(--text-3); margin: 18px 4px 8px; }
  .card { padding: 2px 0; }
  .set { display: flex; align-items: center; gap: 16px; padding: 11px 16px; min-height: 54px; }
  .set + .set { border-top: 1px solid var(--hair); }
  .set .lbl { flex: 1; min-width: 0; }
  .set .lbl .sub { color: var(--text-3); font-size: .92em; margin-top: 1px; }
  .set select.field { min-width: 200px; }
  .set input.field { width: 260px; }
  .set input.field.short { width: 110px; }
  .set.stack { flex-direction: column; align-items: stretch; }
  textarea.field { width: 100%; height: 120px; padding: 10px 12px; font: 12px/1.5 ui-monospace, "Cascadia Code", "Fira Code", monospace; resize: vertical; }
  .seg { display: inline-flex; background: var(--bg-2); border: 1px solid var(--hair); border-radius: var(--radius); padding: 3px; gap: 2px; }
  .seg button { border: 0; background: transparent; padding: 5px 13px; border-radius: calc(var(--radius) - 3px); color: var(--text-2); }
  .seg button.on { background: var(--card); color: var(--text); box-shadow: 0 1px 3px rgba(0,0,0,.18); font-weight: 600; }
  .swatches { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .swatch { width: 26px; height: 26px; border-radius: 50%; border: 2px solid transparent; outline: 2px solid transparent; outline-offset: 1px; padding: 0; }
  .swatch.on { outline-color: var(--text); }
  /* The custom accent swatch: round like the preset ones beside it. */
  input[type=color] { -webkit-appearance: none; appearance: none; width: 26px; height: 26px; border: 0; padding: 0; border-radius: 50%; background: none; cursor: pointer; overflow: hidden; box-shadow: 0 0 0 1px var(--hair); }
  input[type=color]::-webkit-color-swatch-wrapper { padding: 0; }
  input[type=color]::-webkit-color-swatch { border: 0; border-radius: 50%; }
  input[type=range] { width: 200px; accent-color: var(--accent); }
  .val { width: 46px; text-align: right; color: var(--text-2); font-variant-numeric: tabular-nums; }
  .bgs { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }
  .bg { height: 74px; border-radius: var(--radius); border: 2px solid var(--hair); display: flex; align-items: flex-end; padding: 6px 8px; color: #fff; font-weight: 600; text-shadow: 0 1px 3px rgba(0,0,0,.5); }
  .bg.on { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .bg[data-v=aurora] { background: radial-gradient(circle at 20% 30%, #4f46e5, transparent 60%), radial-gradient(circle at 80% 70%, #db2777, transparent 55%), #0b1020; }
  .bg[data-v=gradient] { background: linear-gradient(135deg, #6366f1, #ec4899); }
  .bg[data-v=mesh] { background: radial-gradient(at 10% 10%, #22d3ee 0, transparent 50%), radial-gradient(at 90% 20%, #a78bfa 0, transparent 50%), radial-gradient(at 50% 90%, #f472b6 0, transparent 50%), #1e1b4b; }
  .bg[data-v=plain] { background: var(--bg); color: var(--text); text-shadow: none; }
  .bg[data-v=image] { background: repeating-linear-gradient(45deg, var(--hover) 0 8px, var(--bg-2) 8px 16px); color: var(--text); text-shadow: none; }
  .presets { display: flex; gap: 8px; flex-wrap: wrap; }
  .chip { border: 1px solid var(--hair); background: var(--card); border-radius: 999px; padding: 5px 12px; }
  .chip.on { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
  .note { padding: 10px 14px; border-radius: var(--radius); margin: 8px 0; }
  .note.err { background: color-mix(in srgb, var(--danger) 14%, transparent); color: var(--danger); }
  .note.ok { background: color-mix(in srgb, var(--ok) 14%, transparent); color: var(--ok); }
  .note.info { background: var(--accent-soft); color: var(--text); }
  #restart { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 12px; margin: -26px -34px 20px; padding: 12px 34px; background: var(--glass); backdrop-filter: blur(var(--blur)); border-bottom: 1px solid var(--hair); }
  #restart .grow { flex: 1; }
  .ext { display: flex; align-items: center; gap: 12px; padding: 10px 16px; }
  .ext + .ext { border-top: 1px solid var(--hair); }
  .ext .icon { width: 32px; height: 32px; border-radius: 8px; background: var(--hover); display: grid; place-items: center; color: var(--text-2); }
  .ext .icon svg { width: 18px; height: 18px; }
  .row-actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .pbar { width: 180px; height: 6px; border-radius: 3px; background: var(--selected); overflow: hidden; flex: none; }
  .pbar > i { display: block; height: 100%; background: var(--accent); border-radius: 3px; transition: width .3s var(--ease); }
  .pbar > i.busy { animation: busy 1.2s ease-in-out infinite; }
  @keyframes busy { from { transform: translateX(-100%); } to { transform: translateX(340%); } }
  .models { display: flex; flex-direction: column; gap: 4px; margin-top: 10px; }
  .model { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: var(--radius); background: var(--bg-2); }
  .model .grow { flex: 1; min-width: 0; } .model .sub { color: var(--text-3); font-size: .9em; }
  .tag { font-size: 11px; padding: 1px 7px; border-radius: 8px; background: var(--accent-soft); color: var(--text-2); margin-left: 4px; }
  /* The page fades in once; redrawing after a change doesn't fade it again. */
  #content { animation: cc-fade-in calc(var(--speed) * 1.5) var(--ease) both; }
  .hit { animation: hit 1.2s ease-out; }
  @keyframes hit { from { background: var(--accent-soft); } to { background: transparent; } }
  .checks label { display: flex; align-items: center; gap: 10px; padding: 6px 0; }
  .checks input { accent-color: var(--accent); width: 16px; height: 16px; }
  .site { display: flex; align-items: center; gap: 12px; padding: 8px 16px; }
  .site + .site { border-top: 1px solid var(--hair); }
  .site img { width: 16px; height: 16px; }
  .site .grow { flex: 1; }
  dialog { border: 1px solid var(--hair); border-radius: calc(var(--radius) + 6px); background: var(--panel); color: var(--text); padding: 22px; width: 420px; box-shadow: 0 20px 60px rgba(0,0,0,.45); }
  dialog::backdrop { background: rgba(0,0,0,.45); }
  dialog h2 { margin: 0 0 14px; font-size: 17px; }
  dialog .foot { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; }
  @media (max-width: 760px) { nav { display: none; } main { padding: 20px 16px 60px; } .bgs { grid-template-columns: repeat(3, 1fr); } }
</style>
</head>
<body>
<nav aria-label="Settings sections">
  <h1>Settings</h1>
  <input id="find" class="field find" type="search" placeholder="Search settings" aria-label="Search settings">
  <div id="nav"></div>
</nav>
<main id="main">
  <div id="restart" class="hidden"><div class="grow"><b>Restart to finish.</b> <span class="muted">Some changes take effect after CottonCandy restarts.</span></div><button class="btn primary" id="restartBtn">Restart now</button></div>
  <div id="content"></div>
</main>
<dialog id="clear">
  <h2>Clear browsing data</h2>
  <div class="set" style="padding:0 0 10px"><div class="lbl">Time range</div>
    <select class="field" id="range"><option value="hour">Last hour</option><option value="day">Last 24 hours</option><option value="week">Last 7 days</option><option value="all" selected>All time</option></select></div>
  <div class="checks">
    <label><input type="checkbox" data-c="history" checked> Browsing history</label>
    <label><input type="checkbox" data-c="cookies" checked> Cookies and site data <span class="muted small">(signs you out of most sites)</span></label>
    <label><input type="checkbox" data-c="cache" checked> Cached images and files</label>
    <label><input type="checkbox" data-c="downloads"> Download list <span class="muted small">(files stay on disk)</span></label>
  </div>
  <div class="foot"><button class="btn" id="clearCancel">Cancel</button><button class="btn primary" id="clearGo">Clear data</button></div>
</dialog>
<script src="/ui/cc.js"></script>
<script src="/ui/settings.js"></script>
</body>
</html>
