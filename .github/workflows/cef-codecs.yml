          sudo apt-get install -y --no-install-recommends libpipewire-0.3-dev libspa-0.2-dev
      - name: Build until the deadline
        id: build
        run: |
          set +e
          "$PYTHON" repo/tools/cef-codecs/stage.py "$WORK" "$DEADLINE"
          code=$?
          set -e
          df -h "$WORK" || true
          if [ $code -eq 0 ]; then echo "done=true" >> "$GITHUB_OUTPUT"
          elif [ $code -eq 75 ]; then echo "done=false" >> "$GITHUB_OUTPUT"
          else exit $code; fi
      - name: Save the work folder for the next stage
        if: steps.build.outputs.done == 'false'
        run: bash repo/tools/cef-codecs/state.sh save
      - uses: actions/upload-artifact@v4
        if: steps.build.outputs.done == 'false'
        with:
          name: cef-codecs-${{ inputs.os || 'windows' }}-state-9
          path: ${{ env.STATE_DIR }}/state.tar.zst
          retention-days: 3
          compression-level: 0
      - name: Publish the finished CEF
        if: steps.build.outputs.done == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash repo/tools/cef-codecs/publish.sh
  stage10:
    needs: stage9
    if: needs.stage9.outputs.done == 'false'
    runs-on: ${{ (inputs.os || 'windows') == 'windows' && 'windows-2025' || 'ubuntu-24.04' }}
    timeout-minutes: 358
    outputs:
      done: ${{ steps.build.outputs.done }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Deadline
        # Build for at most 4 hours 45 minutes of this job, leaving time to save the work folder.
        run: echo "DEADLINE=$(( $(date +%s) + 285 * 60 ))" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with: { path: repo }
      - name: Make room and set up
        run: bash repo/tools/cef-codecs/setup.sh
      - uses: actions/download-artifact@v4
        with:
          name: cef-codecs-${{ inputs.os || 'windows' }}-state-9
          path: ${{ env.STATE_DIR }}
      - name: Restore the work folder
        run: bash repo/tools/cef-codecs/state.sh restore
      - name: Windows SDK
        if: runner.os == 'Windows'
        shell: pwsh
        run: repo/tools/cef-codecs/win-sdk.ps1 -Work $env:WORK
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        # CEF builds against the system libraries (no sysroot). install-build-deps leaves out PipeWire,
        # which the screen-capture code asks pkg-config for.
        run: |
          sudo "$WORK/chromium/src/build/install-build-deps.sh" --no-prompt --no-chromeos-fonts || sudo "$WORK/chromium/src/build/install-build-deps.sh" --no-prompt
          sudo apt-get install -y --no-install-recommends libpipewire-0.3-dev libspa-0.2-dev
      - name: Build until the deadline
        id: build
        run: |
          set +e
          "$PYTHON" repo/tools/cef-codecs/stage.py "$WORK" "$DEADLINE"
          code=$?
          set -e
          df -h "$WORK" || true
          if [ $code -eq 0 ]; then echo "done=true" >> "$GITHUB_OUTPUT"
          elif [ $code -eq 75 ]; then echo "done=false" >> "$GITHUB_OUTPUT"
          else exit $code; fi
      - name: Save the work folder for the next stage
        if: steps.build.outputs.done == 'false'
        run: bash repo/tools/cef-codecs/state.sh save
      - uses: actions/upload-artifact@v4
        if: steps.build.outputs.done == 'false'
        with:
          name: cef-codecs-${{ inputs.os || 'windows' }}-state-10
          path: ${{ env.STATE_DIR }}/state.tar.zst
          retention-days: 3
          compression-level: 0
      - name: Publish the finished CEF
        if: steps.build.outputs.done == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash repo/tools/cef-codecs/publish.sh
  out-of-stages:
    needs: stage10
    if: needs.stage10.outputs.done == 'false'
    runs-on: ubuntu-24.04
    steps:
      - run: echo "10 stages weren't enough to finish the build." && exit 1
