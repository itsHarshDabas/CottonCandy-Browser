name: rust
on:
  push:
    paths: ["rust/**", ".github/workflows/rust.yml"]
  pull_request:
    paths: ["rust/**", ".github/workflows/rust.yml"]
  workflow_dispatch:
permissions:
  contents: write
env:
  CARGO_TERM_COLOR: always
  CEF_VERSION: "156.7.0+156.0.31"
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            cef_dir: /home/runner/.local/share/cef
          - os: windows-2025
            cef_dir: C:\cef
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: rust
    env:
      CEF_PATH: ${{ matrix.cef_dir }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "clippy, rustfmt" }
      - name: Linux build deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build libgtk-3-dev libnss3 libasound2t64 libxss1 libgbm1 xvfb
      - name: Windows build deps
        if: runner.os == 'Windows'
        run: choco install ninja -y
      - uses: actions/cache@v4
        with:
          path: ${{ matrix.cef_dir }}
          key: cef-${{ runner.os }}-${{ env.CEF_VERSION }}
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: rust }
      - name: Get CEF
        run: |
          if [ ! -f "$CEF_PATH/archive.json" ]; then
            cargo install export-cef-dir --version "=$CEF_VERSION" --locked
            export-cef-dir --force "$CEF_PATH"
          fi
      # Development sandboxes can't reach CEF's CDN; a draft release (never public) carries a copy for them.
      - name: Share the Linux CEF build with development sandboxes
        if: runner.os == 'Linux' && github.event_name == 'push' && github.ref != 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="cef-dev-${CEF_VERSION%%+*}"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            tar -C "$CEF_PATH" -cf - . | zstd -T0 -10 -o /tmp/cef-linux64.tar.zst
            gh release create "$tag" --draft --title "CEF $CEF_VERSION for development (not a release)" \
              --notes "A copy of CEF's Linux build for development sandboxes. Not a CottonCandy release." /tmp/cef-linux64.tar.zst
          fi
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: cargo build --release
      - name: Smoke test (loads CEF and starts)
        run: |
          cp -r "$CEF_PATH"/. target/release/
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a target/release/cottoncandy --version | tee /tmp/version.txt
          else
            target/release/cottoncandy.exe --version | tee /tmp/version.txt
          fi
          grep -q '^CottonCandy ' /tmp/version.txt
