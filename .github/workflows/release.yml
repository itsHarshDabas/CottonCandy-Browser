name: release
# Pushing a tag like v1.0.0 (or v1.0-beta) builds CottonCandy for Linux and Windows, plus the Windows installer, measures its startup time and memory
# against Google Chrome on the same runner, and publishes a GitHub release with both packages, SHA256SUMS and
# the measured numbers. Run by hand with a tag (Actions → release → Run workflow), it does the same and creates
# the tag. On a pull request that changes it, or run by hand without a tag, it does everything except publish.
# With "codecs" (or a tag like v1.2-Codec) it builds on the CEF that .github/workflows/cef-codecs.yml made with
# the MP4 codecs (H.264, AAC), and publishes only the packages that have them.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths: [".github/workflows/release.yml", "rust/bench/**", "rust/installer/**", "rust/app/**", "tools/ui-check/**", "tools/cef-codecs/**"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create and publish from this commit, like v1.0-beta (empty: build only)"
        type: string
        default: ""
      codecs:
        description: "Build on the CEF with the MP4 codecs (H.264, AAC) from the cef-codecs release"
        type: boolean
        default: false
permissions:
  contents: write
env:
  CARGO_TERM_COLOR: always
  # The release being made: a pushed tag, or the tag asked for when run by hand.
  RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
  CEF_VERSION: "156.7.0+156.0.31"
  # Whether this build should play MP4: asked for by hand, or a tag that ends in -Codec.
  CODECS: ${{ inputs.codecs || endsWith(github.ref_name, '-Codec') || endsWith(inputs.tag, '-Codec') }}
jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-24.04
            cef_dir: /home/runner/.local/share/cef
            target: linux-x86_64
          - os: windows-2025
            cef_dir: C:\cef
            target: windows-x86_64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: rust
    env:
      CEF_PATH: ${{ matrix.cef_dir }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux build deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build libgtk-3-dev libnss3 libasound2t64 libxss1 libgbm1 xvfb
      - name: Windows build deps
        if: runner.os == 'Windows'
        run: choco install ninja -y
      # The stock CEF plays WebM, AV1 and MP3 but not MP4. For a codecs build, the CEF that cef-codecs.yml built
      # for this version and OS, if it has built one; an OS it hasn't is built stock and left out of the release.
      - name: Which CEF
        id: cef
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          plat=$([ "$RUNNER_OS" = Windows ] && echo windows64 || echo linux64)
          asset=""
          if [ "$CODECS" = true ]; then
            asset=$(gh release view "cef-codecs-${CEF_VERSION#*+}" -R "$GITHUB_REPOSITORY" --json assets \
              --jq ".assets[].name | select(endswith(\"${plat}_minimal.tar.bz2\"))")
          fi
          if [ -n "$asset" ]; then echo "flavor=codecs" >> "$GITHUB_OUTPUT"; else echo "flavor=stock" >> "$GITHUB_OUTPUT"; fi
          echo "asset=$asset" >> "$GITHUB_OUTPUT"
          echo "CEF: ${asset:-the stock download}"
      - uses: actions/cache@v4
        with:
          path: ${{ matrix.cef_dir }}
          key: cef-${{ runner.os }}-${{ env.CEF_VERSION }}-${{ steps.cef.outputs.flavor }}
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: rust }
      - name: Get CEF
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET: ${{ steps.cef.outputs.asset }}
        run: |
          if [ ! -f "$CEF_PATH/archive.json" ]; then
            if [ -n "$ASSET" ]; then
              tag="cef-codecs-${CEF_VERSION#*+}"
              gh release download "$tag" -R "$GITHUB_REPOSITORY" -p "$ASSET" -p "$ASSET.sha256" -D "$RUNNER_TEMP/cef"
              # The .sha256 names the file by the path it was built at, so compare only the hash.
              want=$(cut -d' ' -f1 "$RUNNER_TEMP/cef/$ASSET.sha256")
              # (By its bare name: for a path with backslashes, as on Windows, sha256sum puts a \ before the hash.)
              got=$(cd "$RUNNER_TEMP/cef" && sha256sum "$ASSET" | cut -d' ' -f1)
              [ -n "$want" ] && [ "$want" = "$got" ] || { echo "The CEF download doesn't match its .sha256." >&2; exit 1; }
              py=$(command -v python3 || command -v python)
              "$py" ../tools/cef-codecs/unpack.py "$RUNNER_TEMP/cef/$ASSET" "$CEF_PATH"
            else
              cargo install export-cef-dir --version "=$CEF_VERSION" --locked
              export-cef-dir --force "$CEF_PATH"
            fi
          fi
          # Which CEF this package is on, for the release job.
          mkdir -p ../dist && echo "${{ steps.cef.outputs.flavor }}" > ../dist/cef-flavor.txt
      - name: Version
        id: version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | python3 -c "import json,sys; print(next(p['version'] for p in json.load(sys.stdin)['packages'] if p['name'] == 'cottoncandy'))")
          # The tag may leave out a zero patch number: v1.0-beta for 1.0.0-beta.
          short=$(echo "$version" | sed -E 's/^([0-9]+\.[0-9]+)\.0($|-)/\1\2/')
          if [ -n "$RELEASE_TAG" ] && [ "$RELEASE_TAG" != "v$version" ] && [ "$RELEASE_TAG" != "v$short" ]; then
            echo "The tag $RELEASE_TAG doesn't match the version in rust/Cargo.toml ($version)." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - run: cargo test --release
      - run: cargo build --release
      - name: Package
        env:
          DIST: cottoncandy-${{ steps.version.outputs.version }}-${{ matrix.target }}
        run: |
          mkdir -p "../dist/$DIST"
          out="../dist/$DIST"
          cp -r "$CEF_PATH"/. "$out/"
          # Only what runs: no headers, wrapper sources, CMake files or import libraries.
          rm -rf "$out"/include "$out"/libcef_dll "$out"/cmake "$out"/CMakeLists.txt "$out"/archive.json "$out"/*.lib
          cp ../LICENSE "$out/LICENSE.txt"
          if [ "$RUNNER_OS" = Linux ]; then
            cp target/release/cottoncandy "$out/"
            cp ../org.graceos.CottonCandy.svg "$out/cottoncandy.svg"
            # CEF ships libcef.so with its debug information (about 1.4 GB); stripped it is about 280 MB.
            strip --strip-unneeded "$out/libcef.so"
            xvfb-run -a "$out/cottoncandy" --version | tee /tmp/version.txt
            tar -C ../dist -cf - "$DIST" | xz -T0 -6 > "../dist/$DIST.tar.xz"
          else
            cp target/release/cottoncandy.exe "$out/"
            "$out/cottoncandy.exe" --version | tee /tmp/version.txt
            (cd ../dist && 7z a -tzip -mx=7 "$DIST.zip" "$DIST" > /dev/null)
            # The installer: the setup program with the same folder appended.
            python installer/pack.py target/release/cottoncandy-setup.exe "$out" "../dist/CottonCandy-Setup-${{ steps.version.outputs.version }}.exe"
          fi
          grep -q '^CottonCandy ' /tmp/version.txt
          ls -la ../dist
      - name: The window works (toolbar, typing, find bar)
        # Starts the packaged browser and drives it with the real mouse and keyboard: the toolbar must load
        # its styles and scripts, and typed text must land in the address bar and the find bar. v1.0-beta
        # shipped with neither working on Windows.
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: dist
        run: |
          $ErrorActionPreference = 'Stop'
          npm install --prefix "$env:RUNNER_TEMP\pw" --silent playwright-core@1.49.1
          $env:NODE_PATH = "$env:RUNNER_TEMP\pw\node_modules"
          $check = "$env:GITHUB_WORKSPACE\tools\ui-check"
          $exe = (Get-ChildItem -Directory -Filter 'cottoncandy-*' | Select-Object -First 1 | Get-ChildItem -Filter cottoncandy.exe).FullName
          $env:CC_DEBUG_PORT = '9222'
          $browser = Start-Process $exe -PassThru
          try {
            Start-Sleep 20
            function Check { node "$check\check.js" @args; if ($LASTEXITCODE -ne 0) { throw "Check failed: $args" } }
            Check loaded
            Check windows
            # Bring the window to the front with a click on the empty part of the tab row, as a person would.
            & "$check\input.ps1" -X 700 -Y 18
            # The new tab's search box has the keyboard, and hands what you type to the address bar.
            & "$check\input.ps1" -Keys 'hello' -Slow
            Check value cottoncandy://ui/chrome.html url hello
            & "$check\input.ps1" -Keys '{ESC}'
            & "$check\input.ps1" -Keys '^l'
            & "$check\input.ps1" -Keys 'example' -Slow
            Check value cottoncandy://ui/chrome.html url example
            & "$check\input.ps1" -Keys '{ESC}'
            & "$check\input.ps1" -Keys '^f'
            & "$check\input.ps1" -Keys 'duck' -Slow
            Check value cottoncandy://ui/popup.html find duck
            # Closing the find bar gives the keyboard back.
            & "$check\input.ps1" -Keys '{ESC}'
            & "$check\input.ps1" -Keys '^l'
            & "$check\input.ps1" -Keys 'abc' -Slow
            Check value cottoncandy://ui/chrome.html url abc
            Write-Output 'The toolbar loaded, and typing reached the address bar and the find bar.'
            # An MP4 (H.264 picture, AAC sound) plays on the codecs CEF, and not on the stock one.
            $server = Start-Process python -ArgumentList '-m', 'http.server', '8099', '--bind', '127.0.0.1', '--directory', $check -PassThru
            Start-Sleep 3
            $want = if ((Get-Content cef-flavor.txt) -eq 'codecs') { 'yes' } else { 'no' }
            try { Check mp4 http://127.0.0.1:8099/ $want } finally { Stop-Process -Id $server.Id -Force -ErrorAction SilentlyContinue }
          } finally {
            Stop-Process -Id $browser.Id -Force -ErrorAction SilentlyContinue
            Get-Process cottoncandy -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          }
      - name: Install, run and uninstall with the installer
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: dist
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = (Get-ChildItem CottonCandy-Setup-*.exe).FullName
          $p = Start-Process $setup -ArgumentList '--silent', '--dir', "$env:RUNNER_TEMP\cc-test" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "The installer failed ($($p.ExitCode))" }
          $dir = "$env:RUNNER_TEMP\cc-test\CottonCandy"
          Start-Process "$dir\cottoncandy.exe" -ArgumentList '--version' -Wait -RedirectStandardOutput "$env:RUNNER_TEMP\v.txt"
          $v = Get-Content "$env:RUNNER_TEMP\v.txt" -Raw
          Write-Output $v
          if ("$v" -notmatch '^CottonCandy ') { throw 'The installed browser did not start' }
          if (-not (Test-Path "$dir\uninstall.exe")) { throw 'No uninstall.exe' }
          $key = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\CottonCandy'
          Get-ItemProperty $key | Format-List DisplayName, DisplayVersion, InstallLocation, UninstallString
          $lnk = Join-Path ([Environment]::GetFolderPath('Desktop')) 'CottonCandy.lnk'
          $menu = Join-Path ([Environment]::GetFolderPath('Programs')) 'CottonCandy.lnk'
          if (-not (Test-Path $lnk) -or -not (Test-Path $menu)) { throw 'Shortcuts missing' }
          Set-Content "$dir\my-notes.txt" 'mine'
          $u = Start-Process "$dir\uninstall.exe" -ArgumentList '--silent' -Wait -PassThru
          if ($u.ExitCode -ne 0) { throw "The uninstaller failed ($($u.ExitCode))" }
          # It finishes from a copy in the temp folder, so wait for that.
          for ($i = 0; $i -lt 90 -and ((Test-Path "$dir\cottoncandy.exe") -or (Test-Path "$dir\uninstall.exe")); $i++) { Start-Sleep 1 }
          Start-Sleep 5
          if (Test-Path "$dir\cottoncandy.exe") { throw 'The browser is still there' }
          if (Test-Path "$dir\uninstall.exe") { throw 'uninstall.exe is still there' }
          if (-not (Test-Path "$dir\my-notes.txt")) { throw 'The uninstaller removed a file it did not install' }
          if (Test-Path $key) { throw 'Still listed in installed apps' }
          if ((Test-Path $lnk) -or (Test-Path $menu)) { throw 'Shortcuts left behind' }
          if (Get-ChildItem $env:TEMP -Filter 'cottoncandy-uninstall-*.exe') { throw 'The temporary uninstaller was not cleaned up' }
          Write-Output 'Installed, ran and uninstalled cleanly.'
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            dist/*.tar.xz
            dist/*.zip
            dist/*.exe
            dist/cef-flavor.txt
          if-no-files-found: error
          compression-level: 0

  # Startup time and memory, measured on the runner against the Google Chrome it comes with.
  bench:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: linux-x86_64, path: dist }
      - name: Run the benchmark
        run: |
          sudo apt-get update && sudo apt-get install -y xvfb libnss3 libasound2t64 libxss1 libgbm1 libgtk-3-0t64
          mkdir -p cc && tar -C cc --strip-components=1 -xJf dist/*.tar.xz
          Xvfb :99 -screen 0 1400x900x24 & sleep 2
          export DISPLAY=:99
          # Both browsers run without Chromium's sandbox here: the runner's AppArmor rules don't allow it for an
          # unpacked folder, and they must be measured the same way.
          chrome=$(google-chrome --version | grep -o '[0-9]*' | head -1)
          for tabs in 1 5 15; do
            python3 rust/bench/bench.py --name CottonCandy --tabs $tabs --runs 5 --json bench.jsonl -- env CC_NO_SANDBOX=1 "$PWD/cc/cottoncandy" {urls}
            python3 rust/bench/bench.py --name "Google Chrome $chrome" --tabs $tabs --runs 5 --json bench.jsonl -- google-chrome --no-sandbox --user-data-dir={profile} --no-first-run --no-default-browser-check --disable-sync {urls}
          done
          {
            python3 rust/bench/report.py bench.jsonl
            echo
            echo "Measured on a GitHub Actions ubuntu-24.04 runner ($(nproc) CPUs, $(free -g | awk '/Mem:/ {print $2}') GB), under Xvfb."
          } > bench.md
          cat bench.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: bench
          path: |
            bench.md
            bench.jsonl

  release:
    needs: [build, bench]
    if: github.ref_type == 'tag' || inputs.tag != ''
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: artifacts }
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir out
          missing=""
          for dir in artifacts/*-x86_64; do
            # A codecs release has only packages that play MP4.
            if [ "$CODECS" = true ] && [ "$(cat "$dir/cef-flavor.txt")" != codecs ]; then
              missing="$missing ${dir#artifacts/}"
              continue
            fi
            find "$dir" \( -name '*.tar.xz' -o -name '*.zip' -o -name '*.exe' \) -exec mv {} out/ \;
          done
          [ -n "$(ls out)" ] || { echo "No package to publish." >&2; exit 1; }
          if [ "$CODECS" = true ]; then
            media="This build plays MP4 video (H.264) and AAC sound, as well as WebM, AV1 and MP3."
            [ -z "$missing" ] || media="$media There is no codecs package for${missing} yet; use the regular release there."
          else
            media="Plays WebM, AV1, MP3 and Opus. MP4 (H.264, AAC) needs the -Codec release."
          fi
          (cd out && sha256sum * > SHA256SUMS)
          cat > notes.md <<EOF
          CottonCandy ${RELEASE_TAG}, the GraceOS web browser on Chromium (CEF ${CEF_VERSION%%+*}).

          ${media}

          ## Install
          - **Windows:** run \`CottonCandy-Setup-*.exe\`. It installs for you alone (no administrator needed) into
            a folder you can change, adds shortcuts, and lists CottonCandy in Settings → Apps; \`uninstall.exe\`
            in the install folder removes it again. Windows may warn that the installer isn't signed: choose
            *More info → Run anyway*. Or unzip \`cottoncandy-*-windows-x86_64.zip\` anywhere and run \`cottoncandy.exe\`.
          - **Linux:** \`tar -xJf cottoncandy-*-linux-x86_64.tar.xz\` and run \`./cottoncandy\`. Chromium's sandbox
            needs its helper to be owned by root: \`sudo chown root:root chrome-sandbox && sudo chmod 4755 chrome-sandbox\`
            in the unpacked folder (needed on Ubuntu 24.04 and other systems that restrict user namespaces).
          - Grace needs [CherryCola](https://github.com/itsHarshDabas/CherryColaLLM) with a local model.

          Check a download against \`SHA256SUMS\`: \`sha256sum -c SHA256SUMS --ignore-missing\`.

          ## Startup and memory
          $(cat artifacts/bench/bench.md)

          See \`rust/bench/bench.py\` to measure it yourself.
          EOF
          pre=""
          case "$RELEASE_TAG" in *-*) pre="--prerelease" ;; esac
          # Creates the tag at this commit when the release was asked for by hand.
          gh release create "$RELEASE_TAG" $pre --target "$GITHUB_SHA" --title "CottonCandy $RELEASE_TAG" --notes-file notes.md out/*
