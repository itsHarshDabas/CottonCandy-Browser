name: rust
on:
  push:
    paths: ["rust/**", ".github/workflows/rust.yml"]
  pull_request:
    paths: ["rust/**", ".github/workflows/rust.yml"]
  workflow_dispatch:
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: always
  CEF_VERSION: "156.7.0+156.0.31"
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            cef_dir: /home/runner/.local/share/cef
          - os: windows-2025
            cef_dir: C:\cef
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: rust
    env:
      CEF_PATH: ${{ matrix.cef_dir }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "clippy, rustfmt" }
      - name: Linux build deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build libgtk-3-dev libnss3 libasound2t64 libxss1 libgbm1 xvfb
      - name: Windows build deps
        if: runner.os == 'Windows'
        run: choco install ninja -y
      - uses: actions/cache@v4
        with:
          path: ${{ matrix.cef_dir }}
          key: cef-${{ runner.os }}-${{ env.CEF_VERSION }}
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: rust }
      - name: Get CEF
        run: |
          if [ ! -f "$CEF_PATH/archive.json" ]; then
            cargo install export-cef-dir --version "=$CEF_VERSION" --locked
            export-cef-dir --force "$CEF_PATH"
          fi
      - name: Share the Linux CEF build (for development sandboxes without CEF's CDN)
        if: runner.os == 'Linux' && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: cef-linux64-${{ env.CEF_VERSION }}
          path: ${{ matrix.cef_dir }}
          retention-days: 7
          compression-level: 6
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: cargo build --release
