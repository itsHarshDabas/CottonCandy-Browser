<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="cc-token" content="{{TOKEN}}">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'">
<title>Grace</title>
<link rel="stylesheet" href="/ui/base.css">
<link rel="stylesheet" href="/ui/page.css">
<link rel="stylesheet" href="/theme.css">
<style>
  html, body { height: 100%; }
  /* The panel slides open by growing from the edge. Laid out at its full width all the time, the content
     moves in with the edge instead of being squeezed and reflowed on every frame. */
  html { overflow: hidden; }
  body { min-width: 400px; }
  body { display: flex; flex-direction: column; background: var(--bg-2); border-left: 1px solid var(--hair); overflow: hidden; }
  header { display: flex; align-items: center; gap: 8px; padding: 12px 12px 0 14px; }
  header .spark { width: 18px; height: 18px; color: var(--accent); }
  header h1 { flex: 1; margin: 0; font-size: 16px; font-weight: 650; }
  .chip { display: inline-flex; align-items: center; height: 22px; padding: 0 9px; border-radius: 999px; background: var(--accent-soft); color: var(--text-2); font-size: 12px; margin: 8px 14px 0; align-self: flex-start; }
  .seg { display: flex; margin: 12px 14px 0; background: var(--bg); border: 1px solid var(--hair); border-radius: var(--radius); padding: 3px; gap: 2px; }
  .seg button { flex: 1; border: 0; background: transparent; padding: 6px 0; border-radius: calc(var(--radius) - 3px); color: var(--text-2); }
  .seg button.on { background: var(--card); color: var(--text); font-weight: 600; box-shadow: 0 1px 3px rgba(0,0,0,.18); }
  .view { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 10px; padding: 12px 14px 12px; }
  .about { color: var(--text-2); font-size: 13px; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .action { display: flex; align-items: center; gap: 10px; height: 36px; padding: 0 12px; border: 1px solid var(--hair); background: var(--card); border-radius: var(--radius); color: var(--text); text-align: left; }
  .action svg { width: 16px; height: 16px; color: var(--accent); flex: none; }
  .action:hover { background: var(--hover); }
  .answer { flex: 1; min-height: 60px; overflow-y: auto; white-space: pre-wrap; word-wrap: break-word; padding: 12px; border-radius: var(--radius); background: var(--card); border: 1px solid var(--hair); line-height: 1.5; user-select: text; }
  .answer.wait { color: var(--text-3); }
  .msg { padding: 10px 12px; border-radius: 12px; line-height: 1.5; white-space: pre-wrap; word-wrap: break-word; user-select: text; max-width: 92%; }
  .msg.user { align-self: flex-end; background: var(--accent); color: var(--accent-fg); border-bottom-right-radius: 4px; }
  .msg.assistant { align-self: flex-start; background: var(--card); border: 1px solid var(--hair); border-bottom-left-radius: 4px; }
  .msg.note { align-self: stretch; max-width: none; background: color-mix(in srgb, var(--warn) 14%, transparent); color: var(--text); }
  .msg.err { align-self: stretch; max-width: none; background: color-mix(in srgb, var(--danger) 14%, transparent); color: var(--danger); }
  .msg .sources { margin-top: 8px; display: flex; flex-direction: column; gap: 3px; font-size: 12px; }
  .msg .sources a { color: var(--accent); cursor: pointer; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .log { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; padding-right: 2px; }
  .empty-chat { margin: auto; text-align: center; color: var(--text-3); padding: 20px; }
  .empty-chat svg { width: 30px; height: 30px; color: var(--accent); display: block; margin: 0 auto 8px; }
  .compose { display: flex; gap: 6px; align-items: flex-end; }
  .compose textarea { flex: 1; resize: none; height: 40px; max-height: 140px; padding: 9px 11px; font: inherit; }
  .row { display: flex; align-items: center; gap: 8px; }
  .row .grow { flex: 1; }
  label.check { display: inline-flex; align-items: center; gap: 6px; color: var(--text-2); font-size: 13px; }
  label.check input { accent-color: var(--accent); }
  .foot { padding: 0 14px 12px; color: var(--text-3); font-size: 11.5px; line-height: 1.45; }
  .setup { margin: 12px 14px 0; padding: 12px; border-radius: var(--radius); background: var(--card); border: 1px solid var(--hair); display: flex; flex-direction: column; gap: 8px;
    animation: cc-rise calc(var(--speed) * 1.5) var(--ease) both; }
  .setup-t { font-weight: 600; } .setup-s { color: var(--text-2); font-size: 12.5px; line-height: 1.45; }
  .pbar { height: 6px; border-radius: 3px; background: var(--selected); overflow: hidden; }
  .pbar > i { display: block; height: 100%; width: 0; background: var(--accent); border-radius: 3px; transition: width .3s var(--ease); }
  .pbar.busy > i { width: 30%; animation: busy 1.2s ease-in-out infinite; }
  @keyframes busy { from { transform: translateX(-100%); } to { transform: translateX(340%); } }
  .dots::after { content: "…"; animation: dots 1.2s steps(3) infinite; }
  @keyframes dots { 0% { content: "."; } 33% { content: ".."; } 66% { content: "..."; } }
</style>
</head>
<body>
<header><span class="spark" id="spark"></span><h1>Grace</h1><button class="icon-btn" id="close" aria-label="Close Grace" title="Close Grace (Ctrl+Shift+G)"></button></header>
<span class="chip" title="CherryCola runs the model on this computer. Nothing is sent to a cloud service.">Local AI · on this device</span>
<div class="setup hidden" id="setup" role="region" aria-label="Set up Grace">
  <div class="setup-t" id="setupTitle"></div><div class="setup-s" id="setupText"></div>
  <div class="pbar hidden" id="setupBar"><i></i></div>
  <div class="row"><button class="btn primary" id="setupGo"></button><button class="btn" id="setupModels">Choose a model</button></div>
</div>
<div class="seg" role="tablist"><button data-mode="page" class="on" role="tab">This page</button><button data-mode="chat" role="tab">Chat</button></div>

<section class="view" id="page">
  <div class="about" id="about"></div>
  <button class="action" id="summarize"></button>
  <button class="action hidden" id="explain"></button>
  <input class="field" id="question" placeholder="Ask about this page" aria-label="Ask about this page">
  <div class="answer hidden" id="answer" aria-live="polite" aria-label="Grace's answer"></div>
  <div class="row"><div class="grow"></div><button class="btn hidden" id="pageCopy">Copy</button><button class="btn hidden" id="pageStop">Stop</button></div>
</section>

<section class="view hidden" id="chat">
  <div class="log" id="log" aria-live="polite" aria-label="Grace Chat"></div>
  <div class="row"><label class="check"><input type="checkbox" id="web"> Web results</label><div class="grow"></div>
    <button class="btn hidden" id="chatStop">Stop</button><button class="btn" id="newChat">New chat</button></div>
  <div class="compose"><textarea class="field" id="input" placeholder="Message Grace" aria-label="Message Grace" rows="1"></textarea><button class="btn primary" id="send">Send</button></div>
</section>

<p class="foot" id="foot">Made on this computer by CherryCola. Page text goes to the model as data, and Grace only writes text: it can't click, open or run anything. A page can still try to mislead it, so check what matters.</p>
<script src="/ui/cc.js"></script>
<script src="/ui/grace.js"></script>
</body>
</html>
